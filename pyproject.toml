[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-report-reminder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "twscrape>=0.12",
    "openai>=1.0",
    "httpx>=0.27",
    "trafilatura>=1.9",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.scripts]
xreminder = "xreminder.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["xreminder*"]
